        .font-heading {
            font-family: 'Fredoka One', cursive;
        }

        .btn-option {
            transition: all 0.2s ease;
            box-shadow: 0 4px 0 #CBD5E1;
        }

        .btn-option:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #94A3B8;
        }

        .btn-option:active {
            transform: translateY(2px);
            box-shadow: 0 0 0 transparent;
        }

        .correct-anim {
            animation: bounce 0.6s ease;
            background-color: #4ADE80 !important;
            color: white !important;
            border-color: #22C55E !important;
            box-shadow: 0 4px 0 #16A34A !important;

            color: white !important;
            border-color: #EF4444 !important;
            box-shadow: 0 4px 0 #DC2626 !important;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .glass-card {

        let currentQ = 0;
        let score = 0;
        let selectedOption = null;

        function startGame() {
            currentQ = 0;
            score = 0;
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            showQuestion();
        }

        function showQuestion() {
            const q = quizData[currentQ];
            document.getElementById('current-question').innerText = currentQ + 1;
            document.getElementById('score').innerText = score;
            document.getElementById('topic-tag').innerText = q.topic;
            document.getElementById('question-text').innerText = q.question;
            
            // Progress Bar
            const progress = ((currentQ + 1) / quizData.length) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;

            // Reset States
            document.getElementById('explanation-box').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');
            selectedOption = null;

            // Render Options
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'btn-option w-full text-left p-4 rounded-xl border-2 border-indigo-100 bg-white font-semibold text-gray-700 text-base md:text-lg flex items-center justify-between';
                btn.innerHTML = `<span>${opt}</span> <i class="fa-regular fa-circle text-gray-300"></i>`;
                btn.onclick = () => checkAnswer(idx, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(idx, btn) {
            if (selectedOption !== null) return; // Prevent multi click
            selectedOption = idx;

            const q = quizData[currentQ];
            const allBtns = document.getElementById('options-container').children;

            if (idx === q.answer) {
                score++;
                document.getElementById('score').innerText = score;
                btn.className = 'btn-option w-full text-left p-4 rounded-xl border-2 font-semibold text-lg flex items-center justify-between correct-anim';
                btn.innerHTML = `<span>${q.options[idx]}</span> <i class="fa-solid fa-circle-check text-white text-xl"></i>`;
            } else {
                btn.className = 'btn-option w-full text-left p-4 rounded-xl border-2 font-semibold text-lg flex items-center justify-between wrong-anim';
                btn.innerHTML = `<span>${q.options[idx]}</span> <i class="fa-solid fa-circle-xmark text-white text-xl"></i>`;
                
                // Highlight correct one
                const correctBtn = allBtns[q.answer];
                correctBtn.className = 'btn-option w-full text-left p-4 rounded-xl border-2 border-green-500 bg-green-100 text-green-800 font-semibold text-lg flex items-center justify-between';
                correctBtn.innerHTML = `<span>${q.options[q.answer]}</span> <i class="fa-solid fa-circle-check text-green-600 text-xl"></i>`;
            }

            // Show explanation
            document.getElementById('explanation-text').innerText = q.explain;
            document.getElementById('explanation-box').classList.remove('hidden');

            // Show Next Button
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            currentQ++;
            if (currentQ < quizData.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('final-score').innerText = score;

            const feedback = document.getElementById('result-feedback');
            const icon = document.getElementById('result-icon');

            if (score >= 45) {
                icon.innerText = '🏆';
                feedback.innerText = "EXCELLENT!!";
            } else if (score >= 35) {
                icon.innerText = '🌟';
                feedback.innerText = "WELL DONE! ";
            } else if (score >= 25) {
                icon.innerText = '👍';
                feedback.innerText = "GOOD JOB!";
            } else {
                icon.innerText = '💪';
                feedback.innerText = "PRACTICE MORE, PLEASE! ";
            }
        }
    </script>
